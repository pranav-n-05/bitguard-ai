[project]
name = "bitguard-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "E501"]  # line length enforced by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "ASYNC230"]
"app/ingestion/synthetic.py" = ["S311"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
allow_redefinition = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
