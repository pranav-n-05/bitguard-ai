name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bitguard, POSTGRES_PASSWORD: bitguard, POSTGRES_DB: bitguard_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bitguard" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../scripts
      - run: ruff format --check app tests ../scripts
      - run: mypy app
      - run: pytest -q -p no:warnings
      - run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i "s/change-me-to-a-long-random-string-at-least-32-bytes/$(openssl rand -hex 32)/; s/change-me-admin-password/$(openssl rand -hex 12)/" .env
      - run: docker compose --profile app config -q
      - run: docker compose --profile app build
